name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  linux:
    name: Linux (lint + unit tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python (for gdlint)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install gdlint
        run: pip install gdtoolkit

      - name: Install pinned toolchain
        run: bash tools/build/setup.sh

      - name: Run CI checks
        run: bash tools/ci.sh

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gut-results
          path: |
            tools/build/cache/gut.log
            tools/build/cache/gut.clean.log
            ~/.local/share/godot/app_userdata/Sugartrail/gut_results.xml
          if-no-files-found: ignore

  android:
    name: Android (lint + unit tests + debug APK)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python (for gdlint)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install gdlint
        run: pip install gdtoolkit

      - name: Install pinned toolchain (Godot + Android SDK)
        run: bash tools/build/setup.sh

      - name: Run CI checks (lint + unit tests)
        run: bash tools/ci.sh

      - name: Build debug APK
        # The Godot 4.3 headless Android export has a known "configuration
        # errors" path when the export preset is incomplete (custom_template,
        # gradle_build fields empty). That is the Step 12 Blocker tracked in
        # docs/11-implementation-roadmap.md and docs/12-risk-register.md; it
        # is scheduled to be resolved by Step 27 (final export settings).
        # Until then, surface the failure without failing the job — the
        # artifact upload below uses if-no-files-found: ignore so the
        # build log is still preserved for triage.
        run: bash tools/build/build-android.sh
        continue-on-error: true

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sugartrail-debug-apk
          path: build/sugartrail-debug.apk
          if-no-files-found: ignore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gut-results-android
          path: |
            tools/build/cache/gut.log
            tools/build/cache/gut.clean.log
            tools/build/cache/android-build.log
            ~/.local/share/godot/app_userdata/Sugartrail/gut_results.xml
          if-no-files-found: ignore