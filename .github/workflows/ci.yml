name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python (for gdlint)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install gdlint
        run: pip install gdtoolkit

      - name: Install pinned toolchain
        run: bash tools/build/setup.sh

      - name: Run CI checks
        run: bash tools/ci.sh

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gut-results
          path: |
            tools/build/cache/gut.log
            tools/build/cache/gut.clean.log
            ~/.local/share/godot/app_userdata/Sugartrail/gut_results.xml
          if-no-files-found: ignore